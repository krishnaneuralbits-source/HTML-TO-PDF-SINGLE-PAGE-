<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML → PDF Converter</title>
  <link rel="stylesheet" href="style.css">
  <!-- External libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <h2>Paste Your HTML Below</h2>
  <textarea id="htmlInput" placeholder="Paste full HTML code here..."></textarea><br>
  <button onclick="generatePDF('single')">Generate Single Page PDF</button>
  <button onclick="generatePDF('multi')">Generate Multi Page PDF</button>

  <div id="preview"></div>

  <script src="script.js"></script>
</body>
</html>
