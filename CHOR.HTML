<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML → PDF Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f9fafb; padding: 20px; }
    textarea { width: 100%; height: 250px; font-family: monospace; margin-bottom: 20px; }
    button { background: #0f766e; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; margin-right: 10px; }
    button:hover { background: #0d5f58; }
    #preview { background:#fff; padding:20px; border:1px solid #ddd; margin-top:20px; }
  </style>
</head>
<body>
  <h2>Paste Your HTML Below</h2>
  <textarea id="htmlInput" placeholder="Paste full HTML code here..."></textarea><br>
  <button onclick="generatePDF('single')">Generate Single Page PDF</button>
  <button onclick="generatePDF('multi')">Generate Multi Page PDF</button>

  <div id="preview"></div>

  <script>
    async function generatePDF(mode) {
      const htmlCode = document.getElementById('htmlInput').value;
      const preview = document.getElementById('preview');
      preview.innerHTML = htmlCode; // render pasted HTML

      // Wait for fonts/images to load
      await new Promise(r => setTimeout(r, 500));

      const canvas = await html2canvas(preview, { scale: 2, useCORS: true });
      const imgData = canvas.toDataURL('image/png');

      const { jsPDF } = window.jspdf;

      if (mode === 'single') {
        // Single continuous page
        const pdfWidth = canvas.width * 0.75;  // px → pt
        const pdfHeight = canvas.height * 0.75;
        const pdf = new jsPDF({
          orientation: 'portrait',
          unit: 'pt',
          format: [pdfWidth, pdfHeight]
        });
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save('singlepage.pdf');
      } else {
        // Multiple A4 pages
        const pdf = new jsPDF('p', 'pt', 'a4');
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();

        const imgWidth = pageWidth;
        const imgHeight = canvas.height * pageWidth / canvas.width;

        let heightLeft = imgHeight;
        let position = 0;

        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;

        while (heightLeft > 0) {
          position = heightLeft - imgHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }

        pdf.save('multipage.pdf');
      }
    }
  </script>
</body>
</html>
